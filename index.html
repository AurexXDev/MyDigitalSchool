<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Տեխնիկական աշխատանքներ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 26px;
            margin-bottom: 16px;
            color: #1a252f;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #5a6c7d;
            margin-bottom: 24px;
        }
        .contact {
            font-size: 14px;
            color: #7f8c8d;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .contact a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚙️</div>
        <h1>Կատարվում են տեխնիկական աշխատանքներ</h1>
        <p>Հայցում ենք Ձեր ներողամտությունը պատճառված անհարմարության համար։ Մենք թարմացնում ենք կայքը՝ Ձեզ ավելի որակյալ ծառայություններ մատուցելու նպատակով։ Կայքը շուտով կվերսկսի իր աշխատանքը։</p>
        <div class="contact">
            Հարցերի դեպքում կարող եք կապ հաստատել մեզ հետ՝ <br>
            <a href="mailto:info@example.am">info@example.am</a>
        </div>
    </div>

</body>
</html>
